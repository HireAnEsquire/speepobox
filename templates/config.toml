# Committed config layer: defaults that travel with the repo.
# Precedence: flags > BESSEMER_* env > config.local.toml (gitignored) > this
# file > code defaults. Secrets never go here — the agent credential lives in
# a gitignored .env beside this file.

# The pin: the full 40-hex SHA of the bessemer release this repo runs. The
# clone-run shim reads this line and runs the tool at exactly that commit.
# `bessemer upgrade` moves it from one release to the next; change it by hand
# only to another full SHA. A SHA is fit to pin when a `v<N>` tag marks it:
# the tag is a human's check that it is on bessemer's default branch with CI
# green, which is what makes it a release. Keep the line as written: unindented,
# double-quoted, no trailing comment, or the shim cannot read it.
tool-sha = "{{tool-sha}}"

# This repo's agent image, and the ref a dispatch diffs and branches from.
# Both are this repo's answers: the package ships no default for either, and a
# config declaring neither is refused by name.
image = "{{image}}"
base = "{{base}}"

# Where one-off specs and feature issue folders live, relative to the *repo*
# root. Tracked on purpose: `.gitignore` beside this file never ignores it.
tasks-dir = ".bessemer/tasks"

# The command `doctor` and the dispatch preflight name when the agent image is
# missing or stale. It builds `image/Dockerfile` beside this file, with the
# paths `image/inputs` lists. A repo whose image needs more wraps it and names
# the wrapper here.
image-build-command = ".bessemer/bessemer image build"

# Capabilities added back after the sandbox's unconditional `--cap-drop ALL`,
# as ONE comma-separated value — never a TOML array, which merges per index
# across the config layers instead of replacing them. Unset, caps drop to
# none; add an entry only when the setup hook's root path demonstrably needs
# it.
# cap-add = "CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID"

# The setup hook: one host script, relative to the *repo* root, mounted
# read-only into the container and run there before the agent pass. Unset, a
# run has no setup step at all — which is not the same as a hook that does
# nothing. How long it may run is `setup-timeout`, in seconds.
# setup-hook = ".bessemer/setup-hook.sh"

# The container's environment file, relative to the *repo* root and inside
# it: docker reads its contents into the container (`docker run --env-file`),
# and bessemer never opens it. Settings only — the credential is forwarded by
# name, never through this file.
# sandbox-env-file = ".bessemer/env.sandbox"
